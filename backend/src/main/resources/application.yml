spring:
  application:
    name: pharmatrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pharmatrack}
    username: ${DB_USERNAME:pharmatrack}
    password: ${DB_PASSWORD:pharmatrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# JWT configuration (Epic 1 will wire the token issuance/refresh flow)
pharmatrack:
  security:
    jwt:
      secret: ${JWT_SECRET:U2VjdXJlLURldi9Qcm9kLUtleS1DaGFuZ2UtTWUtNjQrQnl0ZXMtU3VwZXItTG9uZy1Gb3ItSFMyNTZBLUhlYWx0aC1GdW5jdGlvbg==}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  alerts:
    cron: ${ALERTS_CRON:0 0 * * * *}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

logging:
  level:
    com.pharmatrack: INFO
    org.flywaydb: INFO
